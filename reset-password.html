<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password · RockWin Investment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="reset-password.css" />
</head>
<body>

    <div class="reset-card">

        <!-- Header -->
        <div class="card-header">
            <div class="brand">RockWin<span> Investment</span></div>
            <p class="sub">Create a New Password</p>
            <p class="help-text">
                Enter the 6‑digit OTP sent to your phone, then choose a strong new password.
            </p>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- Reset Form -->
        <form id="resetForm" novalidate>

            <!-- Phone (auto-filled from URL, shown if missing) -->
            <div class="form-group" id="phoneGroup">
                <label for="phoneNumber">Registered Mobile Line</label>
                <div class="phone-group">
                    <span class="prefix">+254</span>
                    <input type="tel" id="phoneNumber" placeholder="712 345 678" required pattern="[0-9]{9}" autocomplete="tel" />
                </div>
            </div>

            <!-- OTP / Token -->
            <div class="form-group">
                <label for="otpCode">6‑Digit Verification Code</label>
                <input type="text" id="otpCode" placeholder="e.g. 482910" required maxlength="6" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" />
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="new-password" />
                <div class="strength-wrapper">
                    <div class="strength-track">
                        <div id="strengthFill" class="strength-fill" style="width:0%;"></div>
                    </div>
                    <span id="strengthLabel" class="strength-label">Weak</span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password" />
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="btn-submit">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Reset Password</span>
            </button>

        </form>

        <!-- Trust Footer -->
        <div class="trust-footer">
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
                CMA Licensed
            </span>
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 21h18"/>
                    <path d="M5 21V7l8-4v18"/>
                    <path d="M19 21V11l-6-4"/>
                </svg>
                I&M Trustee
            </span>
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                Deloitte Audited
            </span>
        </div>

        <!-- Link back to Login -->
        <div class="card-footer-link">
            Remember your password? <a href="login.html">Sign in here</a>
        </div>

    </div>

    <script src="reset-password.js"></script>

</body>
</html>
