<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password · RockWin Investment</title>
    <meta name="description" content="Enter the reset code and choose a new password." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --paper:          #F5F1E8;
            --paper-deep:     #EDE7DA;
            --ink:            #0F1A14;
            --ink-soft:       #4A534D;
            --ink-mute:       #8A9089;
            --rule:           rgba(15, 26, 20, 0.08);
            --rule-strong:    rgba(15, 26, 20, 0.16);
            --forest:         #1B4332;
            --forest-hover:   #0F2D20;
            --forest-soft:    rgba(27, 67, 50, 0.08);
            --error:          #8A3A2E;
            --error-bg:       rgba(138, 58, 46, 0.06);
            --success:        #1B4332;
            --success-bg:     rgba(27, 67, 50, 0.06);
            --warning:        #8A6A2E;

            --display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
            --body:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* ============================================================
           RESET
           ============================================================ */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--body);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        svg { display: block; }

        /* ============================================================
           MASTHEAD
           ============================================================ */
        .masthead {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: var(--paper);
            border-bottom: 1px solid var(--rule);
        }
        .masthead-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.05rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }
        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--display);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }
        .wordmark-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px; height: 26px;
            background: var(--forest);
            color: var(--paper);
            border-radius: 5px;
            font-weight: 600;
            font-size: 0.88rem;
        }
        .wordmark-sub { color: var(--ink-mute); font-weight: 500; }

        .masthead-right {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 0.88rem;
        }
        .masthead-note { color: var(--ink-mute); }
        .masthead-link {
            font-weight: 500;
            color: var(--ink);
            border-bottom: 1px solid var(--rule-strong);
            padding-bottom: 1px;
            transition: border-color 0.2s ease, color 0.2s ease;
        }
        .masthead-link:hover { border-color: var(--forest); color: var(--forest); }

        /* ============================================================
           MAIN
           ============================================================ */
        .page-main {
            max-width: 480px;
            margin: 0 auto;
            padding: 8rem 1.5rem 4rem;
        }
        .page-card { width: 100%; }

        .card-head { margin-bottom: 2rem; }
        .card-title {
            font-family: var(--display);
            font-size: clamp(1.75rem, 4vw, 2.1rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-bottom: 0.5rem;
            font-variation-settings: "opsz" 120;
        }
        .card-sub {
            font-size: 0.92rem;
            color: var(--ink-soft);
            line-height: 1.6;
        }

        /* ============================================================
           FORM
           ============================================================ */
        .form-group { margin-bottom: 1.25rem; position: relative; }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--ink);
            margin-bottom: 0.5rem;
            letter-spacing: -0.005em;
        }

        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--paper);
            border: 1px solid var(--rule-strong);
            border-radius: 6px;
            color: var(--ink);
            font-size: 1rem;
            font-family: var(--body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .form-group input::placeholder { color: var(--ink-mute); }
        .form-group input:focus {
            border-color: var(--forest);
            box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.08);
        }
        .form-group input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(138, 58, 46, 0.08);
        }

        .field-hint {
            font-size: 0.75rem;
            color: var(--ink-mute);
            margin-top: 0.4rem;
            line-height: 1.5;
        }

        /* ---------- Phone group ---------- */
        .phone-group { display: flex; align-items: stretch; }
        .phone-prefix {
            flex: 0 0 auto;
            padding: 0.85rem 0.95rem;
            background: var(--paper-deep);
            border: 1px solid var(--rule-strong);
            border-right: none;
            border-radius: 6px 0 0 6px;
            color: var(--ink-soft);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }
        .phone-group input {
            border-radius: 0 6px 6px 0;
            flex: 1;
            min-width: 0;
        }
        .phone-group input:focus {
            border-radius: 0 6px 6px 0;
            border-color: var(--forest);
            box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.08);
        }

        /* ---------- OTP input ---------- */
        .otp-input {
            font-family: var(--mono, 'JetBrains Mono', ui-monospace, monospace);
            font-size: 1.35rem !important;
            letter-spacing: 0.5em;
            text-align: center;
            font-weight: 500;
        }

        /* ---------- Password wrap with toggle ---------- */
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 3rem; }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.5rem;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--ink-mute);
            transition: color 0.15s ease, background 0.15s ease;
        }
        .password-toggle:hover { color: var(--ink); background: rgba(15, 26, 20, 0.04); }
        .password-toggle:focus-visible {
            outline: 2px solid var(--forest);
            outline-offset: 2px;
        }
        .password-toggle svg { width: 18px; height: 18px; }
        .password-toggle .eye-closed { display: none; }
        .password-toggle.revealed .eye-open { display: none; }
        .password-toggle.revealed .eye-closed { display: block; }

        /* ---------- Strength meter ---------- */
        .strength-wrapper {
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .strength-track {
            flex: 1;
            height: 2px;
            background: var(--rule);
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            background: var(--error);
            transition: width 0.3s ease, background 0.3s ease;
        }
        .strength-label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-mute);
            min-width: 3.2rem;
            text-align: right;
        }

        /* ---------- Password match ---------- */
        .password-match {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.4rem;
        }
        .password-match.match { color: var(--forest); }
        .password-match.no-match { color: var(--error); }

        /* ---------- Submit button ---------- */
        .btn-submit {
            width: 100%;
            padding: 1rem 1.25rem;
            background: var(--forest);
            color: var(--paper);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            font-family: var(--body);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-submit:hover:not(:disabled) { background: var(--forest-hover); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 1rem;
            height: 1rem;
            border: 1.5px solid rgba(245, 241, 232, 0.35);
            border-top-color: var(--paper);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Alert ---------- */
        .alert-box {
            display: none;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.55;
            margin-bottom: 1.5rem;
            border: 1px solid transparent;
        }
        .alert-box.success {
            display: block;
            background: var(--success-bg);
            border-color: rgba(27, 67, 50, 0.2);
            color: var(--success);
        }
        .alert-box.error {
            display: block;
            background: var(--error-bg);
            border-color: rgba(138, 58, 46, 0.2);
            color: var(--error);
        }

        /* ---------- Trust footer ---------- */
        .trust-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.75rem;
            margin-top: 3rem;
            padding-top: 1.75rem;
            border-top: 1px solid var(--rule);
            flex-wrap: wrap;
        }
        .trust-item {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: var(--ink-mute);
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        .trust-item svg {
            width: 14px;
            height: 14px;
            color: var(--forest);
            flex-shrink: 0;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            .masthead-inner { padding: 0.9rem 1.25rem; }
            .wordmark { font-size: 1rem; }
            .wordmark-mark { width: 24px; height: 24px; font-size: 0.8rem; }
            .masthead-note { display: none; }

            .page-main { padding: 7rem 1.25rem 3rem; }

            .card-title { font-size: 1.6rem; }
            .card-sub { font-size: 0.88rem; }

            .form-group input {
                padding: 0.8rem 0.9rem;
                font-size: 1rem;
            }
            .phone-prefix {
                padding: 0.8rem 0.85rem;
                font-size: 0.9rem;
            }
            .otp-input {
                font-size: 1.15rem !important;
                letter-spacing: 0.4em;
            }

            .btn-submit {
                padding: 0.9rem 1rem;
                font-size: 0.98rem;
            }

            .trust-footer { gap: 1rem 1.5rem; margin-top: 2.25rem; }
            .trust-item { font-size: 0.68rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ====== MASTHEAD ====== -->
    <header class="masthead">
        <div class="masthead-inner">
            <a href="index.html" class="wordmark" aria-label="RockWin Investment">
                <span class="wordmark-mark">R</span>
                <span class="wordmark-text">RockWin<span class="wordmark-sub"> Investment</span></span>
            </a>
            <div class="masthead-right">
                <span class="masthead-note">Remembered it?</span>
                <a href="login.html" class="masthead-link">Sign in</a>
            </div>
        </div>
    </header>

    <!-- ====== FORM ====== -->
    <main class="page-main">
        <div class="page-card">

            <div class="card-head">
                <h1 class="card-title">Reset your password</h1>
                <p class="card-sub">
                    Enter the 6-digit code we emailed you and choose a new password.
                </p>
            </div>

            <div id="alertBox" class="alert-box"></div>

            <form id="resetForm" novalidate>

                <!-- Phone group — hidden automatically when phone is in URL -->
                <div class="form-group" id="phoneGroup">
                    <label for="phoneNumber">Mobile phone number</label>
                    <div class="phone-group">
                        <span class="phone-prefix">+254</span>
                        <input type="tel" id="phoneNumber" placeholder="712 345 678" required pattern="[0-9]{9}" autocomplete="tel" inputmode="numeric" />
                    </div>
                    <div class="field-hint">The number on your RockWin account.</div>
                </div>

                <!-- OTP -->
                <div class="form-group">
                    <label for="otpCode">6-digit reset code</label>
                    <input type="text" id="otpCode" class="otp-input" placeholder="······" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
                    <div class="field-hint">Check the email address registered to your account.</div>
                </div>

                <!-- New password -->
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-wrap">
                        <input type="password" id="newPassword" placeholder="At least 8 characters" required autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" aria-pressed="false">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-wrapper">
                        <div class="strength-track">
                            <div id="strengthFill" class="strength-fill" style="width:0%;"></div>
                        </div>
                        <span id="strengthLabel" class="strength-label">Weak</span>
                    </div>
                </div>

                <!-- Confirm password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="password-wrap">
                        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <div class="password-match" id="passwordMatch"></div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <div id="btnSpinner" class="spinner"></div>
                    <span id="btnText">Reset password</span>
                </button>

            </form>

            <div class="trust-footer">
                <span class="trust-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                    CMA licensed
                </span>
                <span class="trust-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path d="M3 21h18"/>
                        <path d="M5 21V7l8-4v18"/>
                        <path d="M19 21V11l-6-4"/>
                    </svg>
                    Trustee-held at I&amp;M
                </span>
                <span class="trust-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Audited by Deloitte
                </span>
            </div>

        </div>
    </main>

    <script>
        (function() {
            'use strict';

            const API_BASE = 'https://rockwin.onrender.com';

            // ---------- DOM ----------
            const form = document.getElementById('resetForm');
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            const phoneInput = document.getElementById('phoneNumber');
            const otpInput = document.getElementById('otpCode');
            const newPassInput = document.getElementById('newPassword');
            const confirmPassInput = document.getElementById('confirmPassword');

            const strengthFill = document.getElementById('strengthFill');
            const strengthLabel = document.getElementById('strengthLabel');
            const passwordMatch = document.getElementById('passwordMatch');
            const phoneGroup = document.getElementById('phoneGroup');

            // ---------- AUTO-FILL PHONE FROM URL ----------
            (function autoFillPhone() {
                const params = new URLSearchParams(window.location.search);
                const phoneParam = params.get('phone');
                if (!phoneParam) return;

                let raw = phoneParam.replace(/^\+254/, '').replace(/\s/g, '');
                if (/^[0-9]{9}$/.test(raw)) {
                    phoneInput.value = raw;
                    // Hide the phone group — it's already known
                    if (phoneGroup) phoneGroup.style.display = 'none';
                }
            })();

            // ---------- PASSWORD SHOW / HIDE ----------
            document.querySelectorAll('.password-toggle').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const input = document.getElementById(btn.dataset.target);
                    if (!input) return;
                    const reveal = input.type === 'password';
                    input.type = reveal ? 'text' : 'password';
                    btn.classList.toggle('revealed', reveal);
                    btn.setAttribute('aria-pressed', String(reveal));
                    btn.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
                });
            });

            // ---------- PASSWORD STRENGTH ----------
            function checkPasswordStrength(pw) {
                let score = 0;
                if (pw.length >= 6) score++;
                if (/[A-Z]/.test(pw)) score++;
                if (/[0-9]/.test(pw)) score++;
                if (/[^A-Za-z0-9]/.test(pw)) score++;

                const widthMap = ['0%', '25%', '50%', '75%', '100%'];
                const labelMap = ['Too short', 'Weak', 'Medium', 'Good', 'Strong'];
                const colorMap = ['#8A3A2E', '#8A3A2E', '#8A6A2E', '#1B4332', '#1B4332'];

                const index = Math.min(score, 4);
                if (strengthFill) {
                    strengthFill.style.width = widthMap[index];
                    strengthFill.style.background = colorMap[index];
                }
                if (strengthLabel) strengthLabel.textContent = labelMap[index];
                return score;
            }

            // ---------- CONFIRM MATCH ----------
            function validateConfirmPassword() {
                if (!passwordMatch) return true;
                const newPw = newPassInput.value;
                const confirmPw = confirmPassInput.value;

                if (confirmPw.length === 0) {
                    passwordMatch.textContent = '';
                    passwordMatch.className = 'password-match';
                    return true;
                }
                if (newPw === confirmPw) {
                    passwordMatch.textContent = '✓ Passwords match';
                    passwordMatch.className = 'password-match match';
                    return true;
                }
                passwordMatch.textContent = '✗ Passwords do not match';
                passwordMatch.className = 'password-match no-match';
                return false;
            }

            if (newPassInput) {
                newPassInput.addEventListener('input', function() {
                    checkPasswordStrength(this.value);
                    if (confirmPassInput.value.length > 0) validateConfirmPassword();
                });
            }
            if (confirmPassInput) {
                confirmPassInput.addEventListener('input', validateConfirmPassword);
            }

            // ---------- ALERT ----------
            function showAlert(message, type) {
                if (!alertBox) return;
                alertBox.className = 'alert-box';
                alertBox.classList.add(type);
                alertBox.textContent = message;
                if (type === 'success') {
                    clearTimeout(window.alertTimeout);
                    window.alertTimeout = setTimeout(function() {
                        alertBox.className = 'alert-box';
                    }, 6000);
                }
            }

            // ---------- SUBMIT ----------
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    if (alertBox) alertBox.className = 'alert-box';

                    const phoneRaw = phoneInput.value.trim();
                    const phoneNumber = '+254' + phoneRaw.replace(/\s/g, '');
                    const otp = otpInput.value.trim();
                    const newPassword = newPassInput.value;
                    const confirmPassword = confirmPassInput.value;

                    if (!phoneRaw.match(/^[0-9]{9}$/)) {
                        showAlert('Please enter a valid 9-digit phone number.', 'error');
                        return;
                    }
                    if (!otp.match(/^[0-9]{6}$/)) {
                        showAlert('Please enter the 6-digit reset code we emailed you.', 'error');
                        return;
                    }
                    if (newPassword.length < 6) {
                        showAlert('Password must be at least 6 characters.', 'error');
                        return;
                    }
                    if (newPassword !== confirmPassword) {
                        showAlert('Passwords do not match.', 'error');
                        return;
                    }

                    submitBtn.disabled = true;
                    btnSpinner.style.display = 'block';
                    btnText.textContent = 'Updating…';

                    try {
                        const response = await fetch(API_BASE + '/api/auth/reset-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ phoneNumber, otp, newPassword })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            showAlert('Password reset. Redirecting to sign in…', 'success');
                            setTimeout(function() {
                                window.location.href = 'login.html';
                            }, 1600);
                        } else {
                            throw new Error(data.error || 'Invalid or expired code. Please try again.');
                        }
                    } catch (err) {
                        showAlert(err.message || 'Unable to connect. Check your network.', 'error');
                        submitBtn.disabled = false;
                        btnSpinner.style.display = 'none';
                        btnText.textContent = 'Reset password';
                    }
                });
            }

            // ---------- INPUT CLEANUP ----------
            if (phoneInput) {
                phoneInput.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, '').slice(0, 9);
                });
                phoneInput.addEventListener('blur', function() {
                    this.value = this.value.replace(/\s/g, '');
                });
            }

            if (otpInput) {
                otpInput.addEventListener('input', function() {
                    this.value = this.value.replace(/\D/g, '').slice(0, 6);
                });
            }

        })();
    </script>

</body>
</html>
