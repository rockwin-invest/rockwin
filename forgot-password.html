<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password · RockWin Investment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="forgot-password.css" />
</head>
<body>

    <div class="reset-card">

        <!-- Header -->
        <div class="card-header">
            <div class="brand">RockWin<span> Investment</span></div>
            <p class="sub">Reset Your Password</p>
            <p class="help-text">
                Enter your registered mobile number and we'll send you a secure reset code via SMS.
            </p>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- Reset Form -->
        <form id="resetForm" novalidate>

            <!-- Phone (with prefix) -->
            <div class="form-group">
                <label for="phoneNumber">Registered Mobile Line</label>
                <div class="phone-group">
                    <span class="prefix">+254</span>
                    <input type="tel" id="phoneNumber" placeholder="712 345 678" required pattern="[0-9]{9}" autocomplete="tel" />
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn" class="btn-submit">
                <div id="btnSpinner" class="spinner"></div>
                <span id="btnText">Send Reset Code</span>
            </button>

        </form>

        <!-- Resend Timer (hidden by default, shows after success) -->
        <div id="resendTimer" class="resend-timer">
            Didn't receive it? <span class="highlight" id="resendLink">Resend now</span>
            <span id="countdownDisplay" style="display:none;"> · (<span id="countdownSec">60</span>s)</span>
        </div>

        <!-- Trust Footer -->
        <div class="trust-footer">
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
                CMA Licensed
            </span>
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 21h18"/>
                    <path d="M5 21V7l8-4v18"/>
                    <path d="M19 21V11l-6-4"/>
                </svg>
                I&M Trustee
            </span>
            <span>
                <svg class="icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
                Deloitte Audited
            </span>
        </div>

        <!-- Link back to Login -->
        <div class="card-footer-link">
            Remember your password? <a href="login.html">Sign in here</a>
        </div>

    </div>

    <script src="forgot-password.js"></script>

</body>
</html>
